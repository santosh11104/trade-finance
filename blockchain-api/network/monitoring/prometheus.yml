global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'fabric-orderer'
    static_configs:
      - targets: ['orderer.example.com:8443']
    tls_config:
      insecure_skip_verify: true

  - job_name: 'fabric-peers'
    static_configs:
      - targets:
        - 'peer0.org1.example.com:9443'
        - 'peer0.org2.example.com:9443'
        - 'peer0.org3.example.com:9443'
        - 'peer0.org4.example.com:9443'
    tls_config:
      insecure_skip_verify: true

  - job_name: 'api'
    static_configs:
      - targets: ['api:4000']
